name: Live NESO generation ingestion

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

concurrency:
  group: live-neso-generation-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ingestion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "psycopg[binary]>=3.2,<4" \
            "requests>=2.31,<3"

      - name: Run incremental NESO ingestion
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
          NESO_RESOURCE_ID: ${{ secrets.NESO_RESOURCE_ID }}
          PYTHONPATH: src
        run: |
          python \
            src/gb_generation/ingestion/incremental_generation_mix.py \
            --batch-size 1000 \
            --lookback-hours 48
